<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ecoeco</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { max-width: 800px; margin: 30px auto; font-family: Arial, sans-serif; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    </style>
</head>

<body>
    <div style="display: flex; gap: 40px; margin: 20px auto; justify-content: center; flex-wrap: wrap;">
        <div style="flex: 1;">
            <h1>CO2 총 배출량 및 나무심기 예측 (1990~2100)</h1>

            <label>매년 늘어날 12그루 이상 나무를 심는 사람 수:</label>
            <input type="number" id="addTreePlanters" min="0" onkeydown="if(event.key === 'Enter') updateCO2Chart()" style="margin-right: 5px;">
            <button onclick="updateCO2Chart()">업데이트</button> <br>

            총 참여자 수: <output id="totalPeople">0</output> 명 <br>
            총 심은 나무 수: <output id="totalTrees">0</output> 그루 <br>
            총 CO2 흡수량: <output id="totalAbsorbed">0</output> kg <br>

            <canvas id="CO2Chart" width="1000" height="300"></canvas>
        </div>

        <div style="flex: 1;">
            <h1>CO2 총 배출량 및 일회용품 안 쓰기 실천 예측 (1990~2100)</h1>

            <label>매년 늘어날 일회용품 안 쓰기 실천하는 사람 수:</label>
            <input type="number" id="addCarbonReducer" min="0" onkeydown="if(event.key === 'Enter') updateCarbonFootprintChart()" style="margin-right: 5px;">
            <button onclick="updateCarbonFootprintChart()">업데이트</button> <br>

            총 참여자 수: <output id="totalReducePeople">0</output> 명 <br>
            총 실천 수: <output id="totalReduceActions">0</output> 회 <br>
            총 CO2 감소량: <output id="totalReduceCO2">0</output> kg <br>

            <canvas id="CarbonFootprintChart" width="1000" height="300"></canvas>
        </div>
    </div>

    <script>
        function formatNumberKR(num) {
            if (num === 0) return "0";
            
            const units = [
                { value: 1e12, symbol: "조" },
                { value: 1e8, symbol: "억" },
                { value: 1e4, symbol: "만" },
                { value: 1e3, symbol: "천" }
            ];
            
            let result = "";
            let remainder = Math.floor(num);
            
            for (const unit of units) {
                const count = Math.floor(remainder / unit.value);
                remainder = remainder % unit.value;
                if (count > 0) result += count + unit.symbol + " ";
            }
            
            if (remainder > 0) result += remainder.toLocaleString();

            return result.trim();
        }
        
        function linearRegression(x, y) {
            const n = x.length;
            let sumX = 0
            let sumY = 0
            let sumXY = 0
            let sumX2 = 0;
            
            for(let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumXY += x[i] * y[i];
                sumX2 += x[i] * x[i];
            }
            
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            
            return { slope, intercept };
        }

        const CO2 = {
            1990: 256216.0082,  1991: 286190.9877,  1992: 310353.5165,  1993: 347747.4906,  1994: 372197.7143,
            1995: 401672.0912,  1996: 437066.4251,  1997: 457947.2808,  1998: 395004.0749,  1999: 430541.9621,
            2000: 462622.8978,  2001: 482256.2347,  2002: 500515.3671,  2003: 512504.2544,  2004: 521860.6475,
            2005: 521261.4242,  2006: 533407.9104,  2007: 546650.8555,  2008: 561050.6401,  2009: 564255.153,
            2010: 618047.3769,  2011: 652029.5269,  2012: 648655.6184,  2013: 654661.8371,  2014: 647520.0963,
            2015: 651088.8338,  2016: 661823.1395,  2017: 679647.0103,  2018: 701069.2609,  2019: 675177.4041,
            2020: 626722.3281,  2021: 652481.1457,  2022: 635818.4417
        };
        const years = Object.keys(CO2).map(Number);     // 데이터 = https://www.data.go.kr/data/15070396/fileData.do

        const values = years.map(y => CO2[y] * 1e6);    // 1kt = 1,000,000kg (1e6) 변환
        
        // - - - 나무심기 차트 - - - //
        let CO2Chart;

        function updateCO2Chart() {
            const peoplePerYear = Math.max(0, parseInt(document.getElementById("addTreePlanters").value) || 0);
            const treesPerPersonPerYear = 12;   // 한 달에 1그루씩 심는다.
            const absorptionPerTree = 21.77;    // 1그루는 연간 21.77kg CO2를 흡수한다. (링크 조사 필요)
            const { slope, intercept } = linearRegression(years, values);

            const forecastYears = [];
            const forecastValues = [];
            const cumulativeAbsorption = [];

            let totalPeople = 0;
            let totalTrees = 0;
            let totalAbsorbed = 0;
            const treesByYear = {};

            for (let y = 2023; y <= 2100; y++) {
                // 올해 참여자 수
                let peopleThisYear = (y - 2023 + 1) * peoplePerYear
                if (y == 2100) totalPeople = peopleThisYear

                // 올해 심은 나무 수
                treesByYear[y] = peopleThisYear * treesPerPersonPerYear;
                totalTrees += treesByYear[y];

                // 누적 CO2 흡수량
                let absorbedThisYear = 0;
                for (let plantedYear = 2023; plantedYear <= y; plantedYear++) absorbedThisYear += treesByYear[plantedYear] * absorptionPerTree;
                totalAbsorbed = absorbedThisYear;

                const projected = slope * y + intercept;
                forecastYears.push(y);
                forecastValues.push(Math.max(projected - totalAbsorbed, 0));
                cumulativeAbsorption.push(totalAbsorbed);
            }

            document.getElementById("totalPeople").textContent = formatNumberKR(totalPeople);
            document.getElementById("totalTrees").textContent = formatNumberKR(totalTrees);
            document.getElementById("totalAbsorbed").textContent = formatNumberKR(totalAbsorbed);

            const allYears = years.concat(forecastYears);
            const forecastWithOffset = forecastValues;

            const ctx = document.getElementById("CO2Chart").getContext("2d");

            if (CO2Chart) CO2Chart.destroy();

            CO2Chart = new Chart(ctx, {
                type: "line",

                data: {
                    labels: allYears,

                    datasets: [
                        {
                            label: "실제 CO2 배출량",
                            data: values,
                            borderColor: "blue",
                            backgroundColor: "rgba(0, 0, 255, 0.1)",
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0
                        },

                        {
                            label: "예측 CO2 배출량 (탄소 흡수 반영)",
                            data: values.concat(forecastWithOffset),
                            borderColor: "green",
                            backgroundColor: "rgba(0, 128, 0, 0.1)",
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0
                        }
                    ]
                },

                options: {
                    responsive: true,

                    interaction: { mode: "index", intersect: false },

                    scales: {
                        x: {
                            title: { display: true, text: "연도" },
                            ticks: { maxTicksLimit: 12 }
                        },

                        y: {
                            title: { display: true, text: "총 배출량 (kg CO₂-eq)" },
                            ticks: { callback: function(value) { return formatNumberKR(value); } },
                            max: 1800000000000, min: 0
                        }
                    },

                    plugins: {
                        legend: { position: "top" },

                        title: { display: false },

                        tooltip: {
                            filter: function(tooltipItem) { return !(tooltipItem.datasetIndex === 1 && CO2Chart.data.labels[tooltipItem.dataIndex] <= 2022); },
                            
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.parsed.y || 0;
                                    return label + ": " + formatNumberKR(Math.round(value)) + " kg";
                                }
                            }
                        }
                    }
                }
            } );
        }

        // - - - 일회용품 안 쓰기 차트 - - - //
        let CarbonFootprintChart;

        function updateCarbonFootprintChart() {
            const peoplePerYear = Math.max(0, parseInt(document.getElementById("addCarbonReducer").value) || 0);
            const actionsPerPersonPerYear = 1;  // 1년을 통틀어 계산한다.
            const reductionPerAction = 69;      // 아래 문헌 참조
//          KR 한국 기준 통계 기반 (https://www.researchgate.net/publication/340245695_Recycling_and_management_practices_of_plastic_packaging_waste_towards_a_circular_economy_in_South_Korea)

//          한국은 1인당 연간 약 638개의 일회용 플라스틱 제품(PET병, 컵, 비닐봉투, 용기, 수저류 등)을 사용하며, 연간 약 11.8 kg의 무게에 해당

//          플라스틱 1kg 제조 시 CO₂ 배출량 LCA(Life Cycle Assessment) 기준 평균 1kg당 약 2.5kg ~ 6.0kg CO₂eq (재질/공정에 따라)

//          1인당 1년간 사용하는 일회용품(11.8kg)을 만드는 데 드는 CO₂는 약 30kg(11.8 x 2.5 = 29.5) ~ 70kg(11.8 x 6.0 = 70.8) CO₂eq 평균값 기준 약 50kg CO₂eq

//          플라스틱 소각 시 CO₂ 배출량 플라스틱 종류별 평균 1kg 소각 시 약 2.9kg CO₂eq 발생 (출처: IPCC, KMOE 환경부 LCI DB)

//          한국의 생활 폐기물 중 플라스틱 재활용률은 약 40% ~ 50% 수준 그러므로 실제 소각되는 비율은 대략 50% ~ 60%로 추정

//          11.8kg (연간 플라스틱량) × 2.9kg CO₂eq/kg (소각계수) x 0.55 (소각되는 양 비율) ≈ 약 19kg CO₂eq

//          1인당 연간 사용하는 일회용 플라스틱 제품(11.8kg)의 제조에서 약 50kg CO₂eq, 폐기 소각에서 약 19kg CO₂eq가 발생하여, 총 약 69kg CO₂eq가 배출된다.
            const { slope, intercept } = linearRegression(years, values);

            const forecastYears = [];
            const forecastValues = [];
            const cumulativeAbsorption = [];

            let totalReducePeople = 0;
            let totalReduceActions = 0;
            let totalReduceCO2 = 0;
            const actionsByYear = {};

            for (let y = 2023; y <= 2100; y++) {
                // 올해 참여자 수
                let peopleThisYear = (y - 2023 + 1) * peoplePerYear
                if (y == 2100) totalReducePeople = peopleThisYear

                // 올해 실천 수
                actionsByYear[y] = peopleThisYear * actionsPerPersonPerYear;
                totalReduceActions += actionsByYear[y];

                // 누적 CO2 감소량
                let reducedThisYear = 0;
                for (let actionedYear = 2023; actionedYear <= y; actionedYear++) reducedThisYear += actionsByYear[actionedYear] * reductionPerAction;
                totalReduceCO2 = reducedThisYear;

                const projected = slope * y + intercept;
                forecastYears.push(y);
                forecastValues.push(Math.max(projected - totalReduceCO2, 0));
                cumulativeAbsorption.push(totalReduceCO2);
            }

            document.getElementById("totalReducePeople").textContent = formatNumberKR(totalReducePeople);
            document.getElementById("totalReduceActions").textContent = formatNumberKR(totalReduceActions);
            document.getElementById("totalReduceCO2").textContent = formatNumberKR(totalReduceCO2);

            const allYears = years.concat(forecastYears);
            const forecastWithOffset = forecastValues;

            const ctx = document.getElementById("CarbonFootprintChart").getContext("2d");

            if (CarbonFootprintChart) CarbonFootprintChart.destroy();

            CarbonFootprintChart = new Chart(ctx, {
                type: "line",

                data: {
                    labels: allYears,

                    datasets: [
                        {
                            label: "실제 CO2 배출량",
                            data: values,
                            borderColor: "blue",
                            backgroundColor: "rgba(0, 0, 255, 0.1)",
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0
                        },

                        {
                            label: "예측 CO2 배출량 (탄소 흡수 반영)",
                            data: values.concat(forecastWithOffset),
                            borderColor: "green",
                            backgroundColor: "rgba(0, 128, 0, 0.1)",
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0
                        }
                    ]
                },

                options: {
                    responsive: true,

                    interaction: { mode: "index", intersect: false },

                    scales: {
                        x: {
                            title: { display: true, text: "연도" },
                            ticks: { maxTicksLimit: 12 }
                        },

                        y: {
                            title: { display: true, text: "총 배출량 (kg CO₂-eq)" },
                            ticks: { callback: function(value) { return formatNumberKR(value); } },
                            max: 1800000000000, min: 0
                        }
                    },

                    plugins: {
                        legend: { position: "top" },

                        title: { display: false },

                        tooltip: {
                            filter: function(tooltipItem) { return !(tooltipItem.datasetIndex === 1 && CarbonFootprintChart.data.labels[tooltipItem.dataIndex] <= 2022); },
                            
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.parsed.y || 0;
                                    return label + ": " + formatNumberKR(Math.round(value)) + " kg";
                                }
                            }
                        }
                    }
                }
            } );
        }

        // 초기 실행
        updateCO2Chart();
        updateCarbonFootprintChart();
    </script>
</body>

</html>
